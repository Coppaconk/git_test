<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 12px; background: #151515; color: #eee;
           font: 13px/1.4 system-ui, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    select { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 3px; }
    .toggle { font-size: 15px; font-weight: 600; }
    input[type=checkbox] { width: 18px; height: 18px; }
    .legend { margin-top: 10px; border-top: 1px solid #333; padding-top: 8px; }
    .r { display: flex; align-items: center; gap: 6px; margin: 3px 0; font-size: 12px; }
    .s { width: 12px; height: 12px; border-radius: 2px; flex: none; }
    .p { margin-left: auto; opacity: .65; }
    .hint { margin-top: 10px; font-size: 11px; opacity: .6; }
  </style>
</head>
<body>
  <h1>False Color</h1>
  <label class="toggle">Enabled <input type="checkbox" id="enabled"></label>
  <label>Scale
    <select id="preset"></select>
  </label>
  <label>Show legend on page <input type="checkbox" id="legend"></label>
  <div class="legend" id="legendList"></div>
  <div class="hint">Shortcut: Alt+Shift+F (change at brave://extensions/shortcuts)</div>
  <script src="presets.js"></script>
  <script src="popup.js"></script>
</body>
</html>
