<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; margin: 0; padding: 12px; background: #151515; color: #eee;
           font: 13px/1.4 system-ui, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 2px; }
    .host { font-size: 11px; opacity: .6; margin-bottom: 8px; word-break: break-all; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 7px 0; }
    select, input[type=number] { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 3px; }
    input[type=number] { width: 56px; }
    input[type=checkbox] { width: 16px; height: 16px; margin: 0; }
    .big { font-size: 15px; font-weight: 600; }
    .big input { width: 18px; height: 18px; }
    hr { border: 0; border-top: 1px solid #333; margin: 10px 0; }
    .legend { margin-top: 6px; }
    .r { display: flex; align-items: center; gap: 6px; margin: 3px 0; font-size: 12px; }
    .s { width: 12px; height: 12px; border-radius: 2px; flex: none; }
    .p { margin-left: auto; opacity: .65; }
    button, .link { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 4px;
                    padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
    .hint { margin-top: 10px; font-size: 11px; opacity: .6; }
    .row { display: flex; gap: 6px; justify-content: space-between; align-items: center; }
    [hidden] { display: none !important; }
    .note { font-size: 11px; color: #f99; }
  </style>
</head>
<body>
  <h1>False Color</h1>
  <div class="host" id="host"></div>
  <div class="note" id="na" hidden>Extensions can't change this page.</div>

  <label class="big">On for this site <input type="checkbox" id="siteOn"></label>
  <label>On for all sites by default <input type="checkbox" id="allSites"></label>
  <hr>

  <label>Tool <select id="mode"></select></label>
  <label data-mode="falsecolor">Scale <select id="preset"></select></label>
  <label data-mode="zebra">Zebra level (%) <input type="number" id="zebraLevel" min="1" max="100" step="1"></label>
  <label data-mode="peaking">Peaking sensitivity
    <select id="peaking"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select>
  </label>
  <label>Split view (follows mouse) <input type="checkbox" id="split"></label>
  <label>Apply to
    <select id="scope"><option value="all">All images</option><option value="picked">Alt+clicked images</option></select>
  </label>
  <div class="row" id="pickedRow" hidden>
    <span style="font-size:11px;opacity:.7">Alt+click images on the page</span>
    <button id="clearPicked">Clear picks</button>
  </div>
  <hr>

  <label>Hover readout <input type="checkbox" id="readout"></label>
  <label>Scopes
    <select id="scopes"><option value="off">Off</option><option value="histogram">Histogram</option><option value="waveform">Waveform</option></select>
  </label>
  <label>Legend on page <input type="checkbox" id="legend"></label>

  <div class="legend" id="legendList" data-mode="falsecolor"></div>

  <div class="hint">
    <span id="holdHint"></span><br>
    Alt+Shift+F: on/off · Alt+Shift+M: switch tool
  </div>
  <div class="row" style="margin-top:8px">
    <button id="openOptions">Settings &amp; custom scale…</button>
  </div>
  <script src="presets.js"></script>
  <script src="popup.js"></script>
</body>
</html>
